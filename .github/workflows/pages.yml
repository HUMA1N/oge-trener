name: Публикация на GitHub Pages

# Сайт публикуется при каждом изменении ветки main (и вручную кнопкой Run workflow).
# Перед публикацией прогоняются тесты: сломанная версия на сайт не попадёт.
# Один раз нужно включить в репозитории: Settings → Pages → Source: «GitHub Actions».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Автотесты
        run: npm test
      - name: Сборка папки сайта (только файлы, нужные в браузере)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg icons css js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
