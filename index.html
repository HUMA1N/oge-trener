<!doctype html>

    <meta
      name="description"
      content="Тренажёр для подготовки к ОГЭ по математике: задания 1–19 с новыми числами, мгновенная проверка, разбор ошибок, вариант на время и статистика."
    />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
